spring:
  application:
    name: wine-for-all
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,email,profile
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wineforall}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
  flyway:
    # Databases whose schema Hibernate created, before the switch to jOOQ, record V1 as applied instead
    # of running it
    baseline-on-migrate: true
  jooq:
    sql-dialect: postgres
  session:
    jdbc:
      # Sessions live in Postgres so logins survive a backend restart; creates the SPRING_SESSION
      # tables on first startup (later runs hit "already exists", which continue-on-error ignores)
      initialize-schema: always
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  http:
    clients:
      # For the VG and Vinmonopolet clients, so a hung request can't block the nightly jobs
      connect-timeout: 10s
      read-timeout: 30s
  task:
    scheduling:
      pool:
        # The Vinmonopolet stock check runs for 1.5–2 hours; a second thread keeps it from blocking the review sync
        size: 2

app:
  # Nightly VG/Vinmonopolet jobs and their startup runs; switched off in tests
  background-jobs:
    enabled: ${BACKGROUND_JOBS_ENABLED:true}
  bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:esa@isys.no}
  allowed-emails: ${ALLOWED_EMAILS:}
  allowed-origin: ${ALLOWED_ORIGIN:http://localhost:5173}
  vipps-number: ${VIPPS_NUMBER:12345678}
  price-per-ticket: 5

server:
  port: ${PORT:8080}
  servlet:
    session:
      # Stay logged in for 30 days, also after closing the browser or the home screen app
      timeout: 30d
      cookie:
        max-age: 30d
  tomcat:
    threads:
      max: 25
      min-spare: 5
