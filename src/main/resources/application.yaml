spring:
  application:
    name: wine-for-all
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,email,profile
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wineforall}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:esa@isys.no}
  allowed-emails: ${ALLOWED_EMAILS:}
  allowed-origin: ${ALLOWED_ORIGIN:http://localhost:5173}
  vipps-number: ${VIPPS_NUMBER:12345678}
  price-per-ticket: 5

server:
  port: ${PORT:8080}
