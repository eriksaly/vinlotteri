services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: ${DB_NAME:-wineforall}
    ports:
      # Random free host port unless DB_PORT pins one; the app finds it either way
      - target: 5432
        published: ${DB_PORT:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
